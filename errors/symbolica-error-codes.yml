agent_errors:
  docs: https://docs.symbolica.ai/guides/agent-errors
  description: >-
    Distinct from operational errors: agent errors are exceptions the agent intentionally
    raises based on your business logic (custom exception classes, builtin exceptions, or
    result/None-union return types). Handled in application code, not by platform retries.
