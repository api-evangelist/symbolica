format: exception-hierarchy
envelope: >-
  Errors surface as typed exceptions in the SDK runtime. All SDK errors inherit from
  AgenticaError (Python: agentica.errors; TypeScript: @symbolica/agentica/errors). The
  platform retries transient operational failures with exponential backoff + jitter, so
  only unrecoverable errors reach application code.
categories:
  - name: base
    errors:
      - code: AgenticaError
        message: Base exception for all Agentica SDK errors.
      - code: ServerError
        parent: AgenticaError
        message: Base class for errors during remote operations.
      - code: GenerationError
        parent: ServerError
        message: Base class for errors during agent generation.
      - code: InferenceError
        parent: GenerationError
        message: Base class for HTTP errors from the inference service.
  - name: connection
    errors:
      - code: ConnectionError
        parent: AgenticaError
        message: General connection failure.
      - code: WebSocketConnectionError
        parent: ConnectionError
        message: WebSocket connection failed or was interrupted.
      - code: WebSocketTimeoutError
        parent: ConnectionError
        message: WebSocket connection timed out.
  - name: invocation
    errors:
      - code: InvocationError
        parent: AgenticaError
        message: General error during agent invocation.
      - code: TooManyInvocationsError
        parent: InvocationError
        message: Exceeded maximum number of invocations.
      - code: NotRunningError
        parent: InvocationError
        message: Attempted to use an agent that is not running.
  - name: generation
    errors:
      - code: MaxTokensError
