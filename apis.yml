name: Symbolica
description: >-
  Symbolica is an AI research lab (founded 2022; backed by General Catalyst and Khosla
  Ventures) applying category theory and type theory to build reasoning systems that go
  beyond pattern matching. Its developer product is Agentica, a type-safe AI agent framework
  and platform: the Agentica SDK (Python and TypeScript) lets LLM agents integrate directly
  with your code — functions, classes, live objects, and modules — executing in a sandboxed
  REPL, while the Symbolica Platform provides enterprise-scale inference, security,
  sandboxing, hosting, management, and observability for agentic workloads. Agentica is
  SDK-first ("Un-MCP"): it consumes external MCP servers as functions rather than exposing a
  REST API.
