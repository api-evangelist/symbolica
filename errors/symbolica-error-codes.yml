        http_status: 401
        message: Authentication failed or missing.
      - code: PermissionDeniedError
        parent: InferenceError
        http_status: 403
        message: Insufficient permissions.
      - code: NotFoundError
        parent: InferenceError
        http_status: 404
        message: Requested resource not found.
      - code: ConflictError
        parent: InferenceError
        http_status: 409
